services:
  backend:
    build:
      context: .
      dockerfile: API/Dockerfile
    container_name: kvist-backend
    restart: unless-stopped
    ports:
      - "8081:8080"          # API    -> host port 8081
    environment:
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in .env (min 32 chars)}
      Seed__AdminPassword: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
    volumes:
      - kvist-data:/data

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: kvist-client
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:3000"          # web UI -> host port 8080

volumes:
  kvist-data:
